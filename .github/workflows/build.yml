          package com.kyrox.statusclock

          import android.graphics.Typeface
          import android.os.Build
          import java.io.File

          object FontResolver {
              fun resolve(fontName: String, weight: Int): Typeface {
                  try {
                      if (fontName.startsWith("/")) {
                          return createFromFile(fontName, weight)
                      }
                      return Typeface.create(fontName, if (weight >= 600) Typeface.BOLD else Typeface.NORMAL)
                  } catch (_: Exception) {
                      return Typeface.DEFAULT
                  }
              }

              private fun createFromFile(path: String, weight: Int): Typeface {
                  val f = File(path)
                  if (!f.exists()) return Typeface.DEFAULT
                  
                  if (Build.VERSION.SDK_INT >= 26) {
                      val builder = Typeface.Builder(f)
                      if (weight >= 100) builder.setWeight(weight)
                      return builder.build() ?: Typeface.DEFAULT
                  } else {
                      return Typeface.createFromFile(f)
                  }
              }
          }
