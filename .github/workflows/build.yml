name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Write project files
        run: |
          set -e
          cat > settings.gradle.kts <<'KX_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KyroxStatusClock"
          include(":app")
          KX_EOF
          cat > build.gradle.kts <<'KX_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KX_EOF
          cat > gradle.properties <<'KX_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          KX_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'KX_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.kyrox.statusclock"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.kyrox.statusclock"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 7
                  versionName = "1.6"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          KX_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'KX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.HOME" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ClockOverlayService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>

                  <service
                      android:name=".HealJob"
                      android:exported="false"
                      android:permission="android.permission.BIND_JOB_SERVICE" />
              </application>
          </manifest>
          KX_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'KX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowsChanged|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagReportViewIds|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/service_description"
              android:notificationTimeout="0" />
          KX_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'KX_EOF'
          <resources>
              <string name="app_name">Kyrox Status Clock</string>
              <string name="service_description">Draws a clock at the status bar clock position, only while the home screen is showing. It briefly looks at the colour of the strip behind the status bar to pick black or white text. Nothing is stored or sent anywhere.</string>
          </resources>
          KX_EOF
          cat > app/src/main/res/values/themes.xml <<'KX_EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          KX_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml <<'KX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="icon_bg">#2DD4BF</color>
          </resources>
          KX_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'KX_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,34 h60 a8,8 0 0,1 8,8 v24 a8,8 0 0,1 -8,8 h-60 a8,8 0 0,1 -8,-8 v-24 a8,8 0 0,1 8,-8 z" />
              <path
                  android:fillColor="#2DD4BF"
                  android:pathData="M28,42 h52 v24 h-52 z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M32,48 h8 v4 h-8 z M32,56 h8 v4 h-8 z M44,48 h12 v2 h-12 z M44,56 h4 v4 h-4 z M52,56 h4 v4 h-4 z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M64,48 h12 a3,3 0 0,1 3,3 v10 a3,3 0 0,1 -3,3 h-12 a3,3 0 0,1 -3,-3 v-10 a3,3 0 0,1 3,-3 z M64,52 h12 v10 h-12 z" />
          </vector>
          KX_EOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'KX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          KX_EOF
          mkdir -p app/src/main/java/com/kyrox/statusclock
          cat > app/src/main/java/com/kyrox/statusclock/Prefs.kt <<'KX_EOF'
          package com.kyrox.statusclock

          import android.content.Context
          import android.content.SharedPreferences

          object Prefs {
              const val FILE = "clockoverlay"
              const val X = "x_dp"
              const val Y = "y_dp"
              const val SIZE = "size_dp"
              const val SMART = "smart_mode"
              const val FONT = "font_family"
              const val WGHT = "font_weight"
              const val CAL = "calibrating"
              const val UI_DARK = "ui_dark"
              const val HEAL = "auto_heal"

              const val DEF_X = 20f
              const val DEF_Y = 0f
              const val DEF_SIZE = 15.8f
              const val DEF_FONT = "system"

              fun sp(c: Context): SharedPreferences = c.getSharedPreferences(FILE, Context.MODE_PRIVATE)
          }

          // Last Smart-mode detection result, shown in the app to help debugging.
          object Diag {
              @Volatile var smart: String = "not checked yet"
          }
          KX_EOF
          mkdir -p app/src/main/java/com/kyrox/statusclock
          mkdir -p app/src/main/java/com/kyrox/statusclock
          cat > app/src/main/java/com/kyrox/statusclock/Healer.kt <<'KX_EOF'
          package com.kyrox.statusclock

          import android.app.job.JobInfo
          import android.app.job.JobParameters
          import android.app.job.JobScheduler
          import android.app.job.JobService
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.provider.Settings

          // Optional self-recovery. Android only lets an app switch its own accessibility service back on
          // if it holds WRITE_SECURE_SETTINGS, which must be granted once from a computer:
          //   adb shell pm grant com.kyrox.statusclock android.permission.WRITE_SECURE_SETTINGS
          object Healer {
              private const val PERM = "android.permission.WRITE_SECURE_SETTINGS"
              private const val JOB_ID = 4711

              fun canHeal(c: Context): Boolean =
                  c.checkSelfPermission(PERM) == PackageManager.PERMISSION_GRANTED

              private fun component(c: Context) = ComponentName(c, ClockOverlayService::class.java)

              fun isEnabled(c: Context): Boolean {
                  val s = Settings.Secure.getString(c.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                      ?: return false
                  val full = component(c).flattenToString()
                  val short = component(c).flattenToShortString()
                  return s.split(':').any { it.equals(full, true) || it.equals(short, true) }
              }

              fun ensure(c: Context) {
                  try {
                      if (!canHeal(c)) return
                      if (!Prefs.sp(c).getBoolean(Prefs.HEAL, true)) return
                      if (isEnabled(c)) return
                      val cr = c.contentResolver
                      val cur = Settings.Secure.getString(cr, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                      val id = component(c).flattenToString()
                      val next = if (cur.isEmpty()) id else cur + ":" + id
                      Settings.Secure.putString(cr, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES, next)
                      Settings.Secure.putInt(cr, Settings.Secure.ACCESSIBILITY_ENABLED, 1)
                  } catch (_: Throwable) {}
              }

              fun schedule(c: Context) {
                  try {
                      if (!canHeal(c)) return
                      val js = c.getSystemService(Context.JOB_SCHEDULER_SERVICE) as JobScheduler
                      if (js.getPendingJob(JOB_ID) != null) return
                      val job = JobInfo.Builder(JOB_ID, ComponentName(c, HealJob::class.java))
                          .setPeriodic(15 * 60 * 1000L)
                          .setPersisted(true)
                          .build()
                      js.schedule(job)
                  } catch (_: Throwable) {}
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  Healer.ensure(context)
                  Healer.schedule(context)
              }
          }

          class HealJob : JobService() {
              override fun onStartJob(params: JobParameters?): Boolean {
                  Healer.ensure(this)
                  return false
              }

              override fun onStopJob(params: JobParameters?): Boolean = false
          }
          KX_EOF
          cat > app/src/main/java/com/kyrox/statusclock/ClockOverlayService.kt <<'KX_EOF'
          package com.kyrox.statusclock

          import android.accessibilityservice.AccessibilityService
          import android.app.KeyguardManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.util.TypedValue
          import android.view.Display
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityWindowInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.TextClock
          import java.util.concurrent.Executors

          class ClockOverlayService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private val worker = Executors.newSingleThreadExecutor()

              private var wm: WindowManager? = null
              private var clockView: TextClock? = null
              private var attached = false      // overlay window is added to the WindowManager (kept for the whole service life)
              private var shown = false         // overlay is currently visible
              private var lastPkg: String? = null
              private var homePkgs: Set<String> = emptySet()
              private var imePkgs: Set<String> = emptySet()
              private var clockWidth = 0
              private var darkText = false      // automatic colour: true = black text, false = white text
              private var smartMiss = 0
              private var tickerOn = false
              private var shotInFlight = false
              private var lastShotAt = 0L
              private var smartVerdict: Boolean? = null   // null = unknown, true = real clock is drawn at our spot
              private var smartBusy = false
              private var smartCheckAt = 0L
              private var smartFails = 0

              private val clockIds = listOf("com.android.systemui:id/clock", "com.android.systemui:id/clock_text")

              // Every callback is wrapped so one unexpected exception can never crash the process.
              // A crashing accessibility service is switched off by Android and has to be re-enabled by hand.
              private fun safe(block: () -> Unit) {
                  try { block() } catch (_: Throwable) {}
              }

              private val prefListener = SharedPreferences.OnSharedPreferenceChangeListener { _, _ ->
                  handler.post { safe { smartVerdict = null; applyStyle(); evaluate() } }
              }

              private val screenReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      safe {
                          when (intent?.action) {
                              Intent.ACTION_SCREEN_OFF -> { setOnHome(false); setShown(false) }
                              Intent.ACTION_SCREEN_ON -> { resolvePackages(); onWake() }
                              Intent.ACTION_USER_PRESENT -> onWake()
                              Intent.ACTION_CONFIGURATION_CHANGED -> applyStyle()
                          }
                      }
                  }
              }

              private val evalRunnable = Runnable { safe { evaluate() } }

              private val rootEvalRunnable = Runnable {
                  safe {
                      val a = activePackage()
                      if (a != null) lastPkg = a
                      evaluate()
                  }
              }

              private val smartRunnable = Runnable { safe { smartCapture() } }

              // While on the home screen: re-check Smart mode and re-sample the background colour once a second.
              private val ticker = object : Runnable {
                  override fun run() {
                      if (!tickerOn) return
                      safe {
                          if (smartOn()) {
                              // Hidden because the real clock was drawn: keep polling (invisible, no blink).
                              if (smartVerdict == true) smartVerdict = null
                              evaluate()
                          }
                          requestColorSample(false)
                      }
                      if (tickerOn) handler.postDelayed(this, 1000)
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  safe {
                      wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      resolvePackages()

                      val night = (resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES
                      darkText = !night

                      clockView = TextClock(this).apply {
                          includeFontPadding = false
                          gravity = Gravity.CENTER_VERTICAL or Gravity.START
                          visibility = View.INVISIBLE
                      }
                      applyStyle()
                      ensureAttached()

                      Prefs.sp(this).registerOnSharedPreferenceChangeListener(prefListener)
                      val filter = IntentFilter().apply {
                          addAction(Intent.ACTION_SCREEN_OFF)
                          addAction(Intent.ACTION_SCREEN_ON)
                          addAction(Intent.ACTION_USER_PRESENT)
                          addAction(Intent.ACTION_CONFIGURATION_CHANGED)
                      }
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(screenReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                      } else {
                          registerReceiver(screenReceiver, filter)
                      }
                      onWake()
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val e = event ?: return
                  safe { handleEvent(e) }
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  safe { handler.removeCallbacksAndMessages(null) }
                  safe { Prefs.sp(this).unregisterOnSharedPreferenceChangeListener(prefListener) }
                  safe { unregisterReceiver(screenReceiver) }
                  safe { clockView?.let { wm?.removeViewImmediate(it) } }
                  safe { worker.shutdown() }
                  attached = false
                  shown = false
                  tickerOn = false
                  super.onDestroy()
              }

              // ---------------------------------------------------------------- events

              private fun handleEvent(e: AccessibilityEvent) {
                  val pkg = e.packageName?.toString()
                  when (e.eventType) {
                      AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED -> {
                          if (pkg == null || imePkgs.contains(pkg)) return
                          if (isSystemUi(pkg)) {
                              // Notification shade / control centre opened or closed: ask who is really on top.
                              scheduleRootEval(100)
                              return
                          }
                          // Fast path: decide straight from the event, no extra IPC and no delay.
                          lastPkg = pkg
                          evaluate()
                      }
                      AccessibilityEvent.TYPE_WINDOWS_CHANGED -> {
                          // Re-check at most every 5 s while our clock is shown (a re-check blinks it for a moment).
                          if (smartOn() && smartVerdict == false &&
                              SystemClock.elapsedRealtime() - smartCheckAt > 5000) {
                              smartVerdict = null
                              scheduleEval(600)
                          }
                      }
                      AccessibilityEvent.TYPE_VIEW_SCROLLED -> {
                          if (pkg == packageName) return
                          requestColorSample(false)
                      }
                  }
              }

              private fun isSystemUi(pkg: String): Boolean = pkg == "android" || pkg.contains("systemui")

              private fun scheduleEval(ms: Long) {
                  handler.removeCallbacks(evalRunnable)
                  handler.postDelayed(evalRunnable, ms)
              }

              private fun scheduleRootEval(ms: Long) {
                  handler.removeCallbacks(rootEvalRunnable)
                  handler.postDelayed(rootEvalRunnable, ms)
              }

              private fun smartOn(): Boolean = Prefs.sp(this).getBoolean(Prefs.SMART, false)

              private fun onWake() {
                  val km = getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                  if (km.isKeyguardLocked) { setOnHome(false); setShown(false); return }
                  val a = activePackage()
                  if (a != null) lastPkg = a
                  evaluate()
              }

              private fun activePackage(): String? =
                  try { rootInActiveWindow?.packageName?.toString() } catch (_: Throwable) { null }

              private fun resolvePackages() {
                  val homes = mutableSetOf<String>()
                  try {
                      val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                      val pkg = packageManager.resolveActivity(i, PackageManager.MATCH_DEFAULT_ONLY)?.activityInfo?.packageName
                      if (pkg != null && pkg != "android") homes.add(pkg)
                      if (homes.isEmpty()) {
                          for (ri in packageManager.queryIntentActivities(i, PackageManager.MATCH_DEFAULT_ONLY)) {
                              val p = ri.activityInfo?.packageName ?: continue
                              if (p != "android" && p != "com.android.settings") homes.add(p)
                          }
                      }
                  } catch (_: Throwable) {}
                  homePkgs = homes

                  val imes = mutableSetOf<String>()
                  try {
                      val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                      for (m in imm.enabledInputMethodList) imes.add(m.packageName)
                  } catch (_: Throwable) {}
                  imePkgs = imes
              }

              // ---------------------------------------------------------------- decision

              private fun evaluate() {
                  val p = Prefs.sp(this)

                  if (p.getBoolean(Prefs.CAL, false)) { setOnHome(false); setShown(true); return }

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (!pm.isInteractive) { setOnHome(false); setShown(false); return }

                  var pkg = lastPkg
                  if (pkg == null) { pkg = activePackage(); lastPkg = pkg }

                  val onHome = pkg != null && homePkgs.contains(pkg)
                  setOnHome(onHome)
                  if (!onHome) { setShown(false); return }

                  if (p.getBoolean(Prefs.SMART, false)) {
                      if (Build.VERSION.SDK_INT < 30) {
                          if (realClockVisible()) { setShown(false); return }
                      } else {
                          val verdict = smartVerdict
                          if (verdict == null) { setShown(false); startSmartCheck(); return }
                          if (verdict) { setShown(false); return }
                      }
                  }
                  setShown(true)
              }

              private fun setOnHome(on: Boolean) {
                  if (on == tickerOn) return
                  tickerOn = on
                  if (on) smartVerdict = null
                  handler.removeCallbacks(ticker)
                  if (on) handler.postDelayed(ticker, 1000)
              }

              // ---------------------------------------------------------------- real clock detection (Smart mode)

              // Smart mode (Android 11+): hide our clock for a moment, take a screenshot and look at the pixels where
              // the clock sits. White/black text-like pixels there mean the system is drawing its own clock.
              private fun startSmartCheck() {
                  if (smartBusy) return
                  val now = SystemClock.elapsedRealtime()
                  if (now - smartCheckAt < 1200) return      // the ticker retries
                  smartBusy = true
                  smartCheckAt = now
                  handler.postDelayed(smartRunnable, 150)     // let the hidden overlay's frame disappear
              }

              private fun smartCapture() {
                  if (Build.VERSION.SDK_INT < 30) { smartBusy = false; return }
                  val now = SystemClock.elapsedRealtime()
                  val wait = 1100L - (now - lastShotAt)
                  if (wait > 0) { handler.postDelayed(smartRunnable, wait); return }
                  lastShotAt = now
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, worker, object : AccessibilityService.TakeScreenshotCallback {
                          override fun onSuccess(screenshot: AccessibilityService.ScreenshotResult) {
                              val r = try { analyze(screenshot) } catch (_: Throwable) { null }
                              handler.post {
                                  smartBusy = false
                                  safe {
                                      if (r != null) {
                                          smartFails = 0
                                          applyLuma(r[0])
                                          val real = r[1] >= 0.04f
                                          smartVerdict = real
                                          Diag.smart = "text pixels " + Math.round(r[1] * 100) + "% -> " +
                                              (if (real) "real clock drawn (ours hidden)" else "no real clock (ours shown)")
                                      } else {
                                          failSmart("could not read screenshot")
                                      }
                                      evaluate()
                                  }
                              }
                          }

                          override fun onFailure(errorCode: Int) {
                              handler.post {
                                  smartBusy = false
                                  safe { failSmart("screenshot error " + errorCode); evaluate() }
                              }
                          }
                      })
                  } catch (_: Throwable) {
                      smartBusy = false
                      failSmart("screenshot not allowed")
                  }
              }

              // After a few failed checks in a row, show the clock anyway rather than leaving it hidden forever.
              private fun failSmart(why: String) {
                  smartFails++
                  Diag.smart = why + " (" + smartFails + ")"
                  if (smartFails >= 3) smartVerdict = false
              }

              // Returns a short description of the real status bar clock if one is visible
              // at the spot where our clock sits, otherwise null.
              private fun findRealClock(): String? {
                  val sbH = statusBarHeightPx()
                  val d = resources.displayMetrics.density
                  val ourL = Prefs.sp(this).getFloat(Prefs.X, Prefs.DEF_X) * d
                  val ourR = ourL + clockWidth
                  try {
                      for (w in windows) {
                          if (w.type != AccessibilityWindowInfo.TYPE_SYSTEM) continue
                          val root = w.root ?: continue
                          if (root.packageName?.toString() == packageName) continue
                          for (id in clockIds) {
                              val nodes = root.findAccessibilityNodeInfosByViewId(id)
                              if (nodes != null) {
                                  for (n in nodes) {
                                      if (!n.isVisibleToUser) continue
                                      val r = Rect()
                                      n.getBoundsInScreen(r)
                                      // Must be a real, non-empty clock in the status bar, overlapping where ours is drawn.
                                      if (r.width() <= 0 || r.height() <= 0 || r.top >= sbH) continue
                                      if (r.right < ourL - 40 * d || r.left > ourR + 40 * d) continue
                                      if (n.text.isNullOrBlank()) continue
                                      return id.substringAfter("/") + " " + r.toShortString()
                                  }
                              }
                          }
                      }
                  } catch (_: Throwable) {}
                  return null
              }

              private fun realClockVisible(): Boolean {
                  val hit = findRealClock()
                  Diag.smart = hit ?: "no real clock found"
                  return hit != null
              }

              // ---------------------------------------------------------------- show / hide

              private fun ensureAttached(): Boolean {
                  if (attached) return true
                  val v = clockView ?: return false
                  return try {
                      v.visibility = View.INVISIBLE
                      wm?.addView(v, params())
                      attached = true
                      true
                  } catch (_: Throwable) {
                      false
                  }
              }

              // The overlay window stays attached; we only flip its visibility. That is instant,
              // unlike adding/removing a window on every app switch.
              private fun setShown(on: Boolean) {
                  val v = clockView ?: return
                  if (on) {
                      if (!ensureAttached()) return
                      if (!shown || v.visibility != View.VISIBLE) {
                          shown = true
                          v.visibility = View.VISIBLE
                          requestColorSample(true)
                      }
                  } else if (shown) {
                      shown = false
                      v.visibility = View.INVISIBLE
                  }
              }

              // ---------------------------------------------------------------- automatic colour

              private fun applyColor() {
                  val v = clockView ?: return
                  val cal = Prefs.sp(this).getBoolean(Prefs.CAL, false)
                  v.setTextColor(
                      if (cal) 0xFFFF3B30.toInt()
                      else if (darkText) Color.BLACK
                      else Color.WHITE
                  )
              }

              private fun applyLuma(luma: Float) {
                  // Hysteresis so the colour does not flip back and forth on mid-tone wallpapers.
                  val newDark = if (luma > 0.6f) true else if (luma < 0.45f) false else darkText
                  if (newDark != darkText) {
                      darkText = newDark
                      applyColor()
                  }
              }

              private fun requestColorSample(force: Boolean) {
                  if (Build.VERSION.SDK_INT < 30) return
                  if (!shown) return
                  if (Prefs.sp(this).getBoolean(Prefs.CAL, false)) return
                  val now = SystemClock.elapsedRealtime()
                  if (shotInFlight && now - lastShotAt > 5000) shotInFlight = false
                  if (shotInFlight || now - lastShotAt < (if (force) 1100L else 2000L)) return
                  lastShotAt = now
                  shotInFlight = true
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, worker, object : AccessibilityService.TakeScreenshotCallback {
                          override fun onSuccess(screenshot: AccessibilityService.ScreenshotResult) {
                              val r = try { analyze(screenshot) } catch (_: Throwable) { null }
                              handler.post {
                                  shotInFlight = false
                                  if (r != null) safe { applyLuma(r[0]) }
                              }
                          }

                          override fun onFailure(errorCode: Int) {
                              handler.post { shotInFlight = false }
                          }
                      })
                  } catch (_: Throwable) {
                      shotInFlight = false
                  }
              }

              // Returns [median brightness of the strip behind the status bar, fraction of text-like pixels where our
              // clock sits]. Pixels that are almost pure black are ignored for the brightness so the camera
              // cut-out does not skew it.
              private fun analyze(result: AccessibilityService.ScreenshotResult): FloatArray? {
                  val hb = result.hardwareBuffer
                  try {
                      val hw = Bitmap.wrapHardwareBuffer(hb, result.colorSpace) ?: return null
                      val bmp = hw.copy(Bitmap.Config.ARGB_8888, false)
                      hw.recycle()
                      if (bmp == null) return null

                      val d = resources.displayMetrics.density
                      val bandH = minOf(statusBarHeightPx(), bmp.height)
                      val left = Prefs.sp(this).getFloat(Prefs.X, Prefs.DEF_X) * d
                      val clockL = (left - 4 * d).toInt()
                      val clockR = (left + clockWidth + 4 * d).toInt()

                      // 1) background brightness, left part of the bar but not under our clock
                      val maxX = (bmp.width * 0.45f).toInt()
                      val step = maxOf(1, maxX / 30)
                      val rows = intArrayOf(bandH / 4, bandH / 2, (bandH * 3) / 4)
                      val vals = ArrayList<Float>()
                      var x = 0
                      while (x < maxX) {
                          if (x < clockL || x > clockR) {
                              for (y in rows) vals.add(lumaAt(bmp.getPixel(x, y)))
                          }
                          x += step
                      }
                      val lit = ArrayList<Float>()
                      for (v in vals) if (v > 0.02f) lit.add(v)
                      lit.sort()
                      val luma = if (lit.isEmpty()) 0f else lit[lit.size / 2]

                      // 2) text-like pixels inside our clock's box (only meaningful while our overlay is hidden)
                      val x0 = maxOf(0, left.toInt())
                      val x1 = minOf(bmp.width - 1, (left + clockWidth).toInt())
                      val box = ArrayList<Float>()
                      var yy = 0
                      while (yy < bandH) {
                          var xx = x0
                          while (xx <= x1) {
                              box.add(lumaAt(bmp.getPixel(xx, yy)))
                              xx += 2
                          }
                          yy += 2
                      }
                      var frac = 0f
                      if (box.size > 20) {
                          val sorted = ArrayList<Float>(box)
                          sorted.sort()
                          val med = sorted[sorted.size / 2]
                          var hit = 0
                          for (l in box) {
                              if (Math.abs(l - med) > 0.35f && (l > 0.85f || l < 0.15f)) hit++
                          }
                          frac = hit.toFloat() / box.size
                      }
                      bmp.recycle()
                      return floatArrayOf(luma, frac)
                  } finally {
                      try { hb.close() } catch (_: Throwable) {}
                  }
              }

              private fun lumaAt(c: Int): Float =
                  (0.299f * Color.red(c) + 0.587f * Color.green(c) + 0.114f * Color.blue(c)) / 255f

              // ---------------------------------------------------------------- style / layout

              private fun applyStyle() {
                  val v = clockView ?: return
                  val p = Prefs.sp(this)

                  // 12-hour 'h' and 24-hour 'H' both drop the leading zero. No AM/PM.
                  v.format12Hour = "h:mm"
                  v.format24Hour = "H:mm"
                  v.setTextSize(TypedValue.COMPLEX_UNIT_DIP, p.getFloat(Prefs.SIZE, Prefs.DEF_SIZE))

                  // Tabular numbers and left alignment lock the digit positions.
                  v.fontFeatureSettings = "tnum"
                  v.textAlignment = View.TEXT_ALIGNMENT_VIEW_START

                  val fontName = p.getString(Prefs.FONT, Prefs.DEF_FONT) ?: Prefs.DEF_FONT
                  val weight = p.getFloat(Prefs.WGHT, 0f).toInt()
                  val typeface = if (fontName == "system") {
                      Typeface.create("sans-serif", if (weight >= 600) Typeface.BOLD else Typeface.NORMAL)
                  } else {
                      FontResolver.resolve(fontName, weight)
                  }
                  v.typeface = typeface

                  if (weight > 0 && Build.VERSION.SDK_INT >= 26 && fontName.startsWith("/")) {
                      v.setFontVariationSettings("'wght' $weight")
                  } else {
                      v.setFontVariationSettings(null)
                  }

                  // Lock the view width to the widest possible time so the position never shifts.
                  val textWidth = v.paint.measureText("23:88").toInt()
                  clockWidth = textWidth + (6 * resources.displayMetrics.density).toInt()

                  applyColor()

                  if (attached) {
                      try { wm?.updateViewLayout(v, params()) } catch (_: Throwable) {}
                  }
              }

              private fun params(): WindowManager.LayoutParams {
                  val d = resources.displayMetrics.density
                  val p = Prefs.sp(this)
                  val width = if (clockWidth > 0) clockWidth else WindowManager.LayoutParams.WRAP_CONTENT
                  val lp = WindowManager.LayoutParams(
                      width,
                      statusBarHeightPx(),
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = (p.getFloat(Prefs.X, Prefs.DEF_X) * d).toInt()
                  lp.y = (p.getFloat(Prefs.Y, Prefs.DEF_Y) * d).toInt()
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  lp.title = "KyroxStatusClock"
                  return lp
              }

              private fun statusBarHeightPx(): Int {
                  val id = resources.getIdentifier("status_bar_height", "dimen", "android")
                  return if (id > 0) resources.getDimensionPixelSize(id)
                  else (24 * resources.displayMetrics.density).toInt()
              }
          }
