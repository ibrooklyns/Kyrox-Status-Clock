              private fun fmt(v: Float): String {
                  val r = Math.round(v)
                  return if (Math.abs(v - r) < 0.0001f) r.toString()
                  else String.format(Locale.US, "%.2f", v).trimEnd('0').trimEnd('.')
              }

              // One title line (with the current value) and, under it, one row of four equal-width buttons.
              // Equal weights keep every button on screen and give the title the full width.
              private fun stepper(root: LinearLayout, title: String, key: String, def: Float, coarse: Float, fine: Float) {
                  val dp = resources.displayMetrics.density
                  fun px(v: Int) = (v * dp).toInt()

                  val label = TextView(this).apply {
                      textSize = 14f
                      setPadding(0, px(14), 0, px(2))
                  }
                  fun refresh() {
                      label.text = title + ": " + fmt(sp.getFloat(key, def))
                  }
                  fun change(delta: Float) {
                      sp.edit().putFloat(key, sp.getFloat(key, def) + delta).apply()
                      refresh()
                  }

                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val steps = listOf(-coarse, -fine, fine, coarse)
                  for (d in steps) {
                      val b = Button(this).apply {
                          text = (if (d > 0f) "+" else "-") + fmt(Math.abs(d))
                          textSize = 13f
                          setAllCaps(false)
                          minWidth = 0
                          minimumWidth = 0
                          minHeight = 0
                          minimumHeight = 0
                          setPadding(px(2), px(10), px(2), px(10))
                          setOnClickListener { change(d) }
                      }
                      val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      lp.setMargins(px(2), 0, px(2), 0)
                      row.addView(b, lp)
                  }
                  refresh()
                  root.addView(label)
                  root.addView(row)
              }

              private fun findFonts(): List<String> {
                  val dirs = listOf("/system/fonts", "/system_ext/fonts", "/product/fonts", "/system/product/fonts", "/vendor/fonts")
                  val out = mutableListOf<String>()
                  for (d in dirs) {
                      try {
                          File(d).listFiles()?.forEach { f ->
                              val n = f.name.lowercase()
                              if (f.isFile && (n.endsWith(".ttf") || n.endsWith(".otf") || n.endsWith(".ttc"))) {
                                  out.add(f.absolutePath)
                              }
                          }
                      } catch (_: Exception) {}
                  }
                  return out.sortedWith(compareBy({ !File(it).name.lowercase().startsWith("mi") }, { File(it).name.lowercase() }))
              }

              private fun check(text: String, key: String, def: Boolean): CheckBox =
                  CheckBox(this).apply {
                      this.text = text
                      isChecked = sp.getBoolean(key, def)
                      setOnCheckedChangeListener { _, on -> sp.edit().putBoolean(key, on).apply() }
                  }

              private fun serviceEnabled(): Boolean {
                  val s = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                  return s != null && s.contains("$packageName/")
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_FONT && resultCode == RESULT_OK) {
                      data?.data?.let { uri ->
                          try {
                              val target = File(filesDir, "custom_font.ttf")
                              val input = contentResolver.openInputStream(uri) ?: return@let
                              val output = FileOutputStream(target)
                              input.copyTo(output)
                              input.close()
                              output.close()
                              sp.edit().putString(Prefs.FONT, target.absolutePath).apply()
                              AlertDialog.Builder(this).setMessage("Font uploaded and applied!").setPositiveButton("OK", null).show()
                          } catch (e: Exception) {
                              AlertDialog.Builder(this).setMessage("Failed to upload font: ${e.message}").setPositiveButton("OK", null).show()
                          }
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  sp.edit().putBoolean(Prefs.CAL, true).apply()
                  if (Healer.canHeal(this)) {
                      Healer.ensure(this)
                      Healer.schedule(this)
                  }
                  statusText.text = (if (serviceEnabled()) "Status: ON (service running)" else "Status: OFF. Turn it on below.") +
                      (if (sp.getBoolean(Prefs.SMART, false)) "\nSmart mode: " + Diag.smart else "")
              }

              override fun onPause() {
                  sp.edit().putBoolean(Prefs.CAL, false).apply()
                  super.onPause()
              }
          }
