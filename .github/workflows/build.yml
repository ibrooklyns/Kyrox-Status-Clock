              /**
               * A setting with  [−] [ typed value ] [+] [±step]  controls.
               * Tap ±step to cycle through the available step sizes.
               */
              private fun fine(
                  parent: LinearLayout, title: String, key: String, def: Float,
                  steps: FloatArray, decimals: Int, min: Float, max: Float,
                  snap: ((Float, Float) -> Float)? = null
              ) {
                  val scale = when (decimals) { 0 -> 1f; 1 -> 10f; else -> 100f }
                  var stepIdx = 0

                  fun fmt(v: Float): String = String.format(Locale.US, "%." + decimals + "f", v)
                  fun stepText(s: Float): String =
                      "±" + (if (s == s.toInt().toFloat()) s.toInt().toString() else s.toString())

                  parent.addView(TextView(this).apply {
                      text = title
                      textSize = 15f
                      setPadding(0, px(14), 0, 0)
                  })

                  val edit = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER or
                          InputType.TYPE_NUMBER_FLAG_DECIMAL or InputType.TYPE_NUMBER_FLAG_SIGNED
                      setSingleLine(true)
                      gravity = Gravity.CENTER
                      imeOptions = EditorInfo.IME_ACTION_DONE
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  fun show(v: Float) {
                      edit.setText(fmt(v))
                      edit.setSelection(edit.text.length)
                  }

                  fun commit(raw: Float) {
                      val cur = sp.getFloat(key, def)
                      var v = snap?.invoke(cur, raw) ?: raw
                      v = Math.round(v.coerceIn(min, max) * scale) / scale
                      sp.edit().putFloat(key, v).apply()
                      show(v)
                  }

                  fun commitTyped() {
                      val v = edit.text.toString().toFloatOrNull()
                      if (v == null) show(sp.getFloat(key, def)) else commit(v)
                  }

                  val minus = Button(this).apply {
                      text = "−"
                      textSize = 20f
                      minWidth = px(52)
                      minimumWidth = px(52)
                      setOnClickListener {
                          val cur = sp.getFloat(key, def)
                          commit(cur - steps[stepIdx])
                      }
                  }
                  val plus = Button(this).apply {
                      text = "+"
                      textSize = 20f
                      minWidth = px(52)
                      minimumWidth = px(52)
                      setOnClickListener {
                          val cur = sp.getFloat(key, def)
                          commit(cur + steps[stepIdx])
                      }
                  }
                  val stepBtn = Button(this).apply {
                      text = stepText(steps[0])
                      minWidth = px(64)
                      minimumWidth = px(64)
                      setOnClickListener {
                          stepIdx = (stepIdx + 1) % steps.size
                          text = stepText(steps[stepIdx])
                      }
                  }

                  edit.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_DONE) {
                          commitTyped()
                          edit.clearFocus()
                          root.requestFocus()
                          (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager)
                              .hideSoftInputFromWindow(edit.windowToken, 0)
                          true
                      } else false
                  }
                  edit.setOnFocusChangeListener { _, has -> if (!has) commitTyped() }

                  show(sp.getFloat(key, def))

                  parent.addView(LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      addView(minus)
                      addView(edit)
                      addView(plus)
                      addView(stepBtn)
                  })
              }

