              private fun fontsDir(): File = File(filesDir, "fonts").apply { mkdirs() }

              private fun uploadedFonts(): List<File> =
                  (fontsDir().listFiles()?.filter { it.isFile } ?: emptyList()).sortedBy { it.name.lowercase() }

              private fun pickFontFile() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "*/*"
                      putExtra(
                          Intent.EXTRA_MIME_TYPES,
                          arrayOf(
                              "font/ttf", "font/otf", "font/sfnt", "font/collection",
                              "application/x-font-ttf", "application/x-font-otf",
                              "application/x-font-opentype", "application/vnd.ms-opentype",
                              "application/octet-stream"
                          )
                      )
                  }
                  try {
                      startActivityForResult(i, reqFont)
                  } catch (_: Exception) {
                      toast("No file picker available")
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqFont && resultCode == RESULT_OK) {
                      data?.data?.let { importFont(it) }
                  }
              }

              private fun importFont(uri: Uri) {
                  var name = "font_" + System.currentTimeMillis() + ".ttf"
                  try {
                      contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { c ->
                          if (c.moveToFirst()) {
                              val n = c.getString(0)
                              if (!n.isNullOrBlank()) name = n
                          }
                      }
                  } catch (_: Exception) {}

                  val safe = name.replace(Regex("[^A-Za-z0-9._-]"), "_")
                  val lower = safe.lowercase()
                  if (!(lower.endsWith(".ttf") || lower.endsWith(".otf") || lower.endsWith(".ttc"))) {
                      toast("Please pick a .ttf, .otf or .ttc font file")
                      return
                  }

                  val dest = File(fontsDir(), safe)
                  try {
                      val input = contentResolver.openInputStream(uri)
                      if (input == null) {
                          toast("Could not read that file")
                          return
                      }
                      input.use { ins -> dest.outputStream().use { out -> ins.copyTo(out) } }
                  } catch (_: Exception) {
                      dest.delete()
                      toast("Could not read that file")
                      return
                  }

                  if (!FontLoader.canOpen(dest.absolutePath)) {
                      dest.delete()
                      toast("That file is not a usable font")
                      return
                  }

                  sp.edit().putString(Prefs.FONT, dest.absolutePath).apply()
                  refreshFont()
                  toast("Font added and applied")
              }

              private fun findFonts(): List<String> {
                  val dirs = listOf("/system/fonts", "/system_ext/fonts", "/product/fonts", "/system/product/fonts", "/vendor/fonts")
                  val out = mutableListOf<String>()
                  for (d in dirs) {
                      try {
                          File(d).listFiles()?.forEach { f ->
                              val n = f.name.lowercase()
                              if (f.isFile && (n.endsWith(".ttf") || n.endsWith(".otf") || n.endsWith(".ttc"))) {
                                  out.add(f.absolutePath)
                              }
                          }
                      } catch (_: Exception) {}
                  }
                  return out.sortedWith(compareBy({ !File(it).name.lowercase().startsWith("mi") }, { File(it).name.lowercase() }))
              }

              private fun showFontList() {
                  val uploaded = uploadedFonts().map { it.absolutePath }
                  val paths = listOf(Prefs.FONT_SYSTEM) + uploaded + findFonts()
                  val names = paths.map {
                      when {
                          it == Prefs.FONT_SYSTEM -> "★ System font (follows theme)"
                          uploaded.contains(it) -> "⬆ " + File(it).name
                          else -> File(it).name
                      }
                  }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Pick a font")
                      .setItems(names) { _, which ->
                          sp.edit().putString(Prefs.FONT, paths[which]).apply()
                          refreshFont()
                      }
                      .show()
              }

              private fun showDeleteList() {
                  val files = uploadedFonts()
                  if (files.isEmpty()) {
                      toast("No uploaded fonts")
                      return
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Delete which font?")
                      .setItems(files.map { it.name }.toTypedArray()) { _, which ->
                          val f = files[which]
                          if (sp.getString(Prefs.FONT, "") == f.absolutePath) {
                              sp.edit().putString(Prefs.FONT, Prefs.FONT_SYSTEM).apply()
                          }
                          f.delete()
                          refreshFont()
                          toast("Deleted " + f.name)
                      }
                      .show()
              }

              // ============================================================== persistence

              private fun askNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED &&
                      !sp.getBoolean(Prefs.ASKED_NOTIF, false)
                  ) {
                      sp.edit().putBoolean(Prefs.ASKED_NOTIF, true).apply()
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), reqNotif)
                  }
              }

              private fun batteryOk(): Boolean = try {
                  (getSystemService(POWER_SERVICE) as PowerManager).isIgnoringBatteryOptimizations(packageName)
              } catch (_: Exception) { false }

              private fun requestBatteryExemption() {
                  try {
                      startActivity(
                          Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName"))
                      )
                  } catch (_: Exception) {
                      try {
                          startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                      } catch (_: Exception) {
                          openAppInfo()
                      }
                  }
              }

              private fun openAutostart() {
                  try {
                      startActivity(
                          Intent().setComponent(
                              ComponentName(
                                  "com.miui.securitycenter",
                                  "com.miui.permcenter.autostart.AutoStartManagementActivity"
                              )
                          )
                      )
                  } catch (_: Exception) {
                      openAppInfo()
                  }
              }

              private fun openAppInfo() {
                  try {
                      startActivity(
                          Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$packageName"))
                      )
                  } catch (_: Exception) {}
              }

              private fun toast(m: String) = Toast.makeText(this, m, Toast.LENGTH_LONG).show()

              // ================================================================ lifecycle

              private fun serviceEnabled(): Boolean {
                  val s = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                  return s != null && s.contains("$packageName/")
              }

              override fun onResume() {
                  super.onResume()
                  sp.edit().putBoolean(Prefs.CAL, true).apply()
                  statusText.text =
                      (if (serviceEnabled()) "Status: ON (service running)" else "Status: OFF. Turn it on below.") +
                          "\nBattery: " + (if (batteryOk()) "unrestricted ✓" else "restricted - tap the Battery button below")
              }

              override fun onPause() {
                  sp.edit().putBoolean(Prefs.CAL, false).apply()
                  super.onPause()
              }
          }
