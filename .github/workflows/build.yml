                  stepper(root, "X position (dp from left)", Prefs.X, Prefs.DEF_X, 1.0f, 0.1f)
                  stepper(root, "Y position (dp from top)", Prefs.Y, Prefs.DEF_Y, 1.0f, 0.1f)
                  stepper(root, "Size (dp)", Prefs.SIZE, Prefs.DEF_SIZE, 0.5f, 0.05f)
                  stepper(root, "Weight (0 = default)", Prefs.WGHT, 0f, 50f, 10f)

                  root.addView(TextView(this).apply {
                      setPadding(0, px(16), 0, 0)
                      text = "Font: 'system', family name, or uploaded file"
                  })
                  val fontBox = EditText(this).apply {
                      setText(sp.getString(Prefs.FONT, Prefs.DEF_FONT))
                      setSingleLine(true)
                  }
                  root.addView(fontBox)
                  root.addView(Button(this).apply {
                      text = "Apply font"
                      setOnClickListener {
                          sp.edit().putString(Prefs.FONT, fontBox.text.toString().trim()).apply()
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "Upload & use custom font"
                      setOnClickListener {
                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                              type = "font/*"
                              addCategory(Intent.CATEGORY_OPENABLE)
                          }
                          startActivityForResult(intent, PICK_FONT)
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "Pick from installed font files"
                      setOnClickListener {
                          val files = findFonts()
                          if (files.isEmpty()) {
                              AlertDialog.Builder(this@MainActivity).setMessage("No readable font files found.").setPositiveButton("OK", null).show()
                          } else {
                              val names = files.map { File(it).name }.toTypedArray()
                              AlertDialog.Builder(this@MainActivity).setTitle("Pick a font (Mi... fonts first)").setItems(names) { _, which ->
