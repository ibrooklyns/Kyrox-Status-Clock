name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Write project files
        run: |
          set -e
          cat > settings.gradle.kts <<'KX_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KyroxStatusClock"
          include(":app")
          KX_EOF
          cat > build.gradle.kts <<'KX_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KX_EOF
          cat > gradle.properties <<'KX_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          KX_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'KX_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.kyrox.statusclock"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.kyrox.statusclock"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          KX_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'KX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.HOME" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ClockOverlayService"
                      android:exported="true"
                      android:foregroundServiceType="specialUse"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Keeps the status bar clock accessibility service from being killed" />
                  </service>
              </application>
          </manifest>
          KX_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'KX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagReportViewIds|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/service_description"
              android:notificationTimeout="0" />
          KX_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'KX_EOF'
          <resources>
              <string name="app_name">Kyrox Status Clock</string>
              <string name="service_description">Draws a clock at the status bar clock position, only while the home screen is showing. With the \"Match background\" colour option it looks at the brightness of a small strip of the status bar area to pick white or black. It does not store or send anything.</string>
              <string name="keep_channel">Keep running</string>
              <string name="keep_title">Kyrox Status Clock</string>
              <string name="keep_text">Running</string>
          </resources>
          KX_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml <<'KX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#1ACF94</color>
          </resources>
          KX_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'KX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Launch theme: light by default, dark when the system is in dark mode (see values-night) -->
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar" />

              <!-- Themes the settings screen picks from -->
              <style name="ThemeLight" parent="android:Theme.Material.Light.NoActionBar" />

              <style name="ThemeDark" parent="android:Theme.Material.NoActionBar" />

              <style name="ThemeAmoled" parent="android:Theme.Material.NoActionBar">
                  <item name="android:colorBackground">#000000</item>
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:colorButtonNormal">#1F1F1F</item>
              </style>
          </resources>
          KX_EOF
          mkdir -p app/src/main/res/values-night
          cat > app/src/main/res/values-night/themes.xml <<'KX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar" />
          </resources>
          KX_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_stat_clock.xml <<'KX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM12,20c-4.41,0 -8,-3.59 -8,-8s3.59,-8 8,-8 8,3.59 8,8 -3.59,8 -8,8zM12.5,7H11v6l5.25,3.15 0.75,-1.23 -4.5,-2.67z" />
          </vector>
          KX_EOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'KX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          KX_EOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'KX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          KX_EOF
          mkdir -p app/src/main/java/com/kyrox/statusclock
          cat > app/src/main/java/com/kyrox/statusclock/Prefs.kt <<'KX_EOF'
          package com.kyrox.statusclock

          import android.content.Context
          import android.content.SharedPreferences

          object Prefs {
              const val FILE = "clockoverlay"
              const val X = "x_dp"            // distance from the left screen edge
              const val Y = "y_dp"            // vertical nudge (0 = top of the screen)
              const val SIZE = "size_dp"      // text size
              const val AMPM = "show_ampm"    // 12-hour mode only
              const val WHITE = "white_text"  // legacy (v1): replaced by COLOR
              const val COLOR = "color_mode"  // see MODE_* below
              const val SMART = "smart_mode"  // hide overlay while the real clock is visible
              const val FONT = "font_family"  // FONT_SYSTEM, a family name, OR absolute path to a font file
              const val WGHT = "font_weight"  // weight (100-900), 0 = font default
              const val CAL = "calibrating"   // true while the settings screen is open
              const val KEEP = "keep_alive"   // run as a foreground service so the system doesn't kill it
              const val THEME = "app_theme"   // 0 auto, 1 light, 2 dark, 3 AMOLED
              const val ASKED_NOTIF = "asked_notif"
              const val DISGUISE = "disguise_text" // add an invisible character so our text never equals the real clock's

              const val MODE_WHITE = 0
              const val MODE_BLACK = 1
              const val MODE_DAYNIGHT = 2     // white in system dark mode, black in light mode
              const val MODE_BACKGROUND = 3   // white/black depending on what is behind the clock

              const val FONT_SYSTEM = "system" // follow the system / theme font

              const val DEF_X = 20f
              const val DEF_Y = 0f
              const val DEF_SIZE = 15.8f      // status_bar_clock_size from your theme
              const val DEF_FONT = FONT_SYSTEM

              fun sp(c: Context): SharedPreferences = c.getSharedPreferences(FILE, Context.MODE_PRIVATE)

              fun colorMode(p: SharedPreferences): Int {
                  if (p.contains(COLOR)) return p.getInt(COLOR, MODE_WHITE)
                  return if (p.getBoolean(WHITE, true)) MODE_WHITE else MODE_BLACK
              }
          }
          KX_EOF
          mkdir -p app/src/main/java/com/kyrox/statusclock
          cat > app/src/main/java/com/kyrox/statusclock/FontLoader.kt <<'KX_EOF'
          package com.kyrox.statusclock

          import android.graphics.Typeface
          import android.os.Build
          import java.io.File
          import java.io.RandomAccessFile

          /** Builds the clock typeface and makes the weight setting actually work. */
          object FontLoader {

              class Result(val typeface: Typeface, val fakeBold: Boolean)

              fun load(name: String, weight: Int): Result {
                  return try {
                      when {
                          name.startsWith("/") -> fromFile(File(name), weight)
                          name == Prefs.FONT_SYSTEM -> Result(withWeight(Typeface.DEFAULT, weight), false)
                          else -> Result(withWeight(Typeface.create(name, Typeface.NORMAL), weight), false)
                      }
                  } catch (_: Throwable) {
                      Result(Typeface.DEFAULT, false)
                  }
              }

              /** True if the file can be loaded as a font. */
              fun canOpen(path: String): Boolean {
                  return try { build(File(path), 0, false) != null } catch (_: Throwable) { false }
              }

              private fun fromFile(f: File, weight: Int): Result {
                  val variable = weight >= 1 && hasWeightAxis(f)
                  val t = build(f, weight, variable) ?: return Result(Typeface.DEFAULT, false)
                  // Static (non-variable) font file: it only has the weights it ships with.
                  // For a heavy request, thicken the strokes so the setting still has an effect.
                  return Result(t, weight >= 600 && !variable)
              }

              private fun build(f: File, weight: Int, variable: Boolean): Typeface? {
                  if (!f.isFile) return null
                  val b = Typeface.Builder(f)
                  if (variable) b.setFontVariationSettings("'wght' $weight")
                  return b.build()
              }

              private fun withWeight(base: Typeface, weight: Int): Typeface {
                  if (weight < 1) return base
                  return if (Build.VERSION.SDK_INT >= 28) {
                      Typeface.create(base, weight.coerceIn(1, 1000), false)
                  } else {
                      Typeface.create(base, if (weight >= 600) Typeface.BOLD else Typeface.NORMAL)
                  }
              }

              /** Looks for an 'fvar' table, i.e. the font is a variable font. */
              private fun hasWeightAxis(f: File): Boolean {
                  try {
                      RandomAccessFile(f, "r").use { r ->
                          val first = r.readInt()
                          if (first == 0x74746366) {            // 'ttcf' collection
                              r.readInt()                        // version
                              val n = r.readInt()
                              if (n < 1) return false
                              val off = r.readInt().toLong() and 0xFFFFFFFFL
                              r.seek(off)
                              r.readInt()                        // sfnt version
                          }
                          val numTables = r.readUnsignedShort()
                          r.skipBytes(6)
                          for (i in 0 until numTables) {
                              val tag = r.readInt()
                              r.skipBytes(12)
                              if (tag == 0x66766172) return true // 'fvar'
                          }
                      }
                  } catch (_: Throwable) {}
                  return false
              }
          }
          KX_EOF
          mkdir -p app/src/main/java/com/kyrox/statusclock
          cat > app/src/main/java/com/kyrox/statusclock/ClockOverlayService.kt <<'KX_EOF'
          package com.kyrox.statusclock

          import android.accessibilityservice.AccessibilityService
          import android.app.Notification
          import android.app.Service
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.util.TypedValue
          import android.view.Display
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.inputmethod.InputMethodManager
          import android.widget.TextClock
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import kotlin.math.min

          /**
           * Draws a clock where the status bar clock normally sits, but only while the
           * home screen (launcher) is the active window.
           *
           * Speed: the overlay window is created once and only toggled VISIBLE/INVISIBLE,
           * the home screen is detected straight from the window-change event (no cross-process
           * queries on the fast path) and all preferences are cached in memory.
           */
          class ClockOverlayService : AccessibilityService() {

              private var wm: WindowManager? = null
              private var clockView: TextClock? = null
              private var attached = false
              private var shown = false
              private var lastPkg: String? = null
              private var homePkgs: Set<String> = setOf("com.miui.home")
              private var imePkgs: Set<String> = emptySet()
              private val handler = Handler(Looper.getMainLooper())
              private val bg: ExecutorService by lazy { Executors.newSingleThreadExecutor() }

              // Cached preferences (no SharedPreferences reads on the hot path)
              private var calibrating = false
              private var smart = false
              private var colorMode = Prefs.MODE_WHITE
              private var posX = Prefs.DEF_X

              // Result of the last background brightness sample: true = dark background -> white text
              private var bgDark = true
              private var lastShot = 0L

              private val verifyRunnable = Runnable { evaluate() }
              private val sampleRunnable = Runnable { sampleBackground() }

              private val prefListener = SharedPreferences.OnSharedPreferenceChangeListener { _, _ ->
                  handler.post {
                      reloadPrefs()
                      applyStyle()
                      updateServiceInfo()
                      updateKeepAlive()
                      evaluate()
                      if (shown) requestSamples()
                  }
              }

              private var fgOn = false

              /**
               * Persistence: running as a foreground service (with a minimal, silent notification)
               * makes the system far less willing to kill the process.
               */
              private fun updateKeepAlive() {
                  val want = Prefs.sp(this).getBoolean(Prefs.KEEP, true)
                  if (want == fgOn) return
                  try {
                      if (want) {
                          val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          val ch = NotificationChannel(
                              "keep_alive", getString(R.string.keep_channel), NotificationManager.IMPORTANCE_MIN
                          )
                          ch.setShowBadge(false)
                          nm.createNotificationChannel(ch)
                          val open = PendingIntent.getActivity(
                              this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                          )
                          val n = Notification.Builder(this, "keep_alive")
                              .setSmallIcon(R.drawable.ic_stat_clock)
                              .setContentTitle(getString(R.string.keep_title))
                              .setContentText(getString(R.string.keep_text))
                              .setOngoing(true)
                              .setContentIntent(open)
                              .build()
                          if (Build.VERSION.SDK_INT >= 34) {
                              startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                          } else {
                              startForeground(1, n)
                          }
                          fgOn = true
                      } else {
                          stopForeground(Service.STOP_FOREGROUND_REMOVE)
                          fgOn = false
                      }
                  } catch (_: Throwable) {
                      fgOn = false
                  }
              }

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          Intent.ACTION_SCREEN_OFF -> setShown(false)
                          Intent.ACTION_CONFIGURATION_CHANGED -> {
                              // Theme / font / dark-mode change: rebuild the style from the system.
                              applyStyle()
                              schedule(0)
                          }
                          else -> schedule(0)
                      }
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  resolvePackages()
                  reloadPrefs()

                  clockView = TextClock(this).apply {
                      includeFontPadding = false
                      gravity = Gravity.CENTER_VERTICAL or Gravity.START
                      visibility = View.INVISIBLE
                  }
                  applyStyle()
                  updateServiceInfo()
                  attach()
                  updateKeepAlive()

                  Prefs.sp(this).registerOnSharedPreferenceChangeListener(prefListener)
                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_SCREEN_OFF)
                      addAction(Intent.ACTION_USER_PRESENT)
                      addAction(Intent.ACTION_CONFIGURATION_CHANGED)
                  }
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(receiver, filter)
                  }
                  schedule(0)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val e = event ?: return
                  // Note: TYPE_WINDOWS_CHANGED events usually have no package name, so it can be null here.
                  val pkg = e.packageName?.toString()
                  if (pkg == packageName) return

                  when (e.eventType) {
                      // Smart mode: the status bar / its clock appearing or disappearing shows up here.
                      AccessibilityEvent.TYPE_WINDOWS_CHANGED -> {
                          if (smart && !calibrating) schedule(120)
                      }
                      AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED -> {
                          if (pkg == null) return
                          lastPkg = pkg
                          if (calibrating) return
                          when {
                              // Fast path: the launcher just came up -> show right away.
                              homePkgs.contains(pkg) -> {
                                  if (smart) schedule(60) else setShown(true)
                              }
                              // Shade / keyboard: the window underneath may still be home, so check.
                              pkg == "com.android.systemui" || imePkgs.contains(pkg) -> schedule(120)
                              // Any other app: hide immediately.
                              else -> setShown(false)
                          }
                      }
                      AccessibilityEvent.TYPE_VIEW_SCROLLED -> {
                          // In smart mode a scroll on the home screen can bring the real clock back.
                          if (!shown && !smart) return
                          if (smart) schedule(120)
                          if (colorMode == Prefs.MODE_BACKGROUND) {
                              handler.removeCallbacks(sampleRunnable)
                              handler.postDelayed(sampleRunnable, 250)
                          }
                      }
                  }
              }

              override fun onInterrupt() {}

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  handler.post { applyStyle() }
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  try { Prefs.sp(this).unregisterOnSharedPreferenceChangeListener(prefListener) } catch (_: Exception) {}
                  try { unregisterReceiver(receiver) } catch (_: Exception) {}
                  try { bg.shutdownNow() } catch (_: Exception) {}
                  detach()
                  super.onDestroy()
              }

              // ---------------------------------------------------------------- state

              private fun reloadPrefs() {
                  val p = Prefs.sp(this)
                  calibrating = p.getBoolean(Prefs.CAL, false)
                  smart = p.getBoolean(Prefs.SMART, false)
                  colorMode = Prefs.colorMode(p)
                  posX = p.getFloat(Prefs.X, Prefs.DEF_X)
              }

              /** Only listen for scroll events when a mode actually needs them. */
              private fun updateServiceInfo() {
                  try {
                      val info = serviceInfo ?: return
                      var t = AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED
                      if (smart) t = t or AccessibilityEvent.TYPE_WINDOWS_CHANGED
                      if (smart || colorMode == Prefs.MODE_BACKGROUND) t = t or AccessibilityEvent.TYPE_VIEW_SCROLLED
                      if (info.eventTypes != t) {
                          info.eventTypes = t
                          serviceInfo = info
                      }
                  } catch (_: Exception) {}
              }

              private fun schedule(delayMs: Long) {
                  handler.removeCallbacks(verifyRunnable)
                  handler.postDelayed(verifyRunnable, delayMs)
              }

              private fun resolvePackages() {
                  val set = mutableSetOf("com.miui.home")
                  try {
                      val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                      val pkg = packageManager
                          .resolveActivity(i, PackageManager.MATCH_DEFAULT_ONLY)
                          ?.activityInfo?.packageName
                      if (pkg != null && pkg != "android") set.add(pkg)
                  } catch (_: Exception) {}
                  homePkgs = set
                  try {
                      val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                      imePkgs = imm.enabledInputMethodList.map { it.packageName }.toSet()
                  } catch (_: Exception) {}
              }

              /** Slow-path check: ask the system which window is really active. */
              private fun evaluate() {
                  if (calibrating) { setShown(true); return }

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (!pm.isInteractive) { setShown(false); return }

                  var pkg: String? = null
                  try {
                      val root = rootInActiveWindow
                      pkg = root?.packageName?.toString()
                      root?.recycle()
                  } catch (_: Exception) {}
                  if (pkg == null) pkg = lastPkg

                  val onHome = pkg != null && homePkgs.contains(pkg)
                  if (!onHome) { setShown(false); return }

                  if (smart) {
                      // The real clock can appear/disappear without any accessibility event (and during the
                      // home transition it settles a moment after the window change). So while on the home
                      // screen in smart mode, keep re-checking instead of relying on events.
                      val real = realClockVisible()
                      schedule(600)
                      if (real) { setShown(false); return }
                  }
                  setShown(true)
              }

              private var lastDebug = ""

              /** Smart mode: is the system's own status bar clock currently visible? */
              private fun realClockVisible(): Boolean {
                  val sb = StringBuilder()
                  var result = false
                  try {
                      for (w in windows) {
                          val root = w.root
                          if (root == null) {
                              sb.append("window type=").append(w.type).append(" root=null\n")
                              continue
                          }
                          val pkg = root.packageName?.toString()
                          if (pkg == packageName) { root.recycle(); continue }   // never look at our own overlay
                          val nodes = root.findAccessibilityNodeInfosByViewId("com.android.systemui:id/clock")
                          var visible = false
                          var count = 0
                          if (nodes != null) {
                              for (n in nodes) {
                                  count++
                                  if (n.isVisibleToUser) visible = true
                                  n.recycle()
                              }
                          }
                          sb.append("window type=").append(w.type).append(" pkg=").append(pkg)
                              .append(" clockNodes=").append(count).append(" visible=").append(visible).append('\n')
                          root.recycle()
                          if (visible) result = true
                      }
                  } catch (e: Exception) {
                      sb.append("error: ").append(e.javaClass.simpleName).append('\n')
                  }
                  sb.append("=> real clock visible: ").append(result)
                  val s = sb.toString()
                  if (s != lastDebug) {
                      lastDebug = s
                      try {
                          getSharedPreferences("clockdebug", Context.MODE_PRIVATE).edit().putString("smart", s).apply()
                      } catch (_: Exception) {}
                  }
                  return result
              }

              // ------------------------------------------------------------- window

              private fun attach() {
                  val v = clockView ?: return
                  if (attached) return
                  try {
                      v.visibility = View.INVISIBLE
                      wm?.addView(v, params())
                      attached = true
                  } catch (_: Exception) {}
              }

              private fun detach() {
                  val v = clockView ?: return
                  if (!attached) return
                  try { wm?.removeViewImmediate(v) } catch (_: Exception) {}
                  attached = false
                  shown = false
              }

              /** The window stays attached; showing/hiding is just a visibility flip (very fast). */
              private fun setShown(on: Boolean) {
                  if (on) {
                      if (!attached) attach()
                      if (!attached) return
                  }
                  val v = clockView ?: return
                  if (shown == on) return
                  shown = on
                  v.visibility = if (on) View.VISIBLE else View.INVISIBLE
                  if (on) {
                      applyColor()
                      requestSamples()
                  } else {
                      handler.removeCallbacks(sampleRunnable)
                  }
              }

              // -------------------------------------------------------------- style

              private fun applyStyle() {
                  val v = clockView ?: return
                  val p = Prefs.sp(this)

                  // An invisible zero-width space on the end: looks identical, but the text is never
                  // exactly the same string as the system status bar clock (MIUI may react to a duplicate).
                  val tail = if (p.getBoolean(Prefs.DISGUISE, true)) "'\u200B'" else ""
                  v.format12Hour = (if (p.getBoolean(Prefs.AMPM, false)) "h:mm a" else "h:mm") + tail
                  // No leading zero on the hour (9:05, not 09:05) in both 12h and 24h mode.
                  v.format24Hour = "H:mm" + tail
                  v.setTextSize(TypedValue.COMPLEX_UNIT_DIP, p.getFloat(Prefs.SIZE, Prefs.DEF_SIZE))

                  val fontName = p.getString(Prefs.FONT, Prefs.DEF_FONT) ?: Prefs.DEF_FONT
                  val weight = p.getFloat(Prefs.WGHT, 0f).toInt()
                  val f = FontLoader.load(fontName, weight)
                  v.paint.isFakeBoldText = f.fakeBold
                  v.typeface = f.typeface
                  v.invalidate()

                  applyColor()
                  if (attached) {
                      try { wm?.updateViewLayout(v, params()) } catch (_: Exception) {}
                  }
              }

              private fun isNight(): Boolean =
                  (resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK) ==
                      Configuration.UI_MODE_NIGHT_YES

              private fun textColor(): Int {
                  if (calibrating) return 0xFFFF3B30.toInt()
                  return when (colorMode) {
                      Prefs.MODE_BLACK -> Color.BLACK
                      Prefs.MODE_DAYNIGHT -> if (isNight()) Color.WHITE else Color.BLACK
                      Prefs.MODE_BACKGROUND ->
                          if (Build.VERSION.SDK_INT >= 30) (if (bgDark) Color.WHITE else Color.BLACK)
                          else (if (isNight()) Color.WHITE else Color.BLACK)
                      else -> Color.WHITE
                  }
              }

              private fun applyColor() {
                  clockView?.setTextColor(textColor())
              }

              private fun params(): WindowManager.LayoutParams {
                  val d = resources.displayMetrics.density
                  val p = Prefs.sp(this)
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      statusBarHeightPx(),
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = (p.getFloat(Prefs.X, Prefs.DEF_X) * d).toInt()
                  lp.y = (p.getFloat(Prefs.Y, Prefs.DEF_Y) * d).toInt()
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  lp.title = "KyroxStatusClock"
                  return lp
              }

              private fun statusBarHeightPx(): Int {
                  val id = resources.getIdentifier("status_bar_height", "dimen", "android")
                  return if (id > 0) resources.getDimensionPixelSize(id)
                  else (24 * resources.displayMetrics.density).toInt()
              }

              // ------------------------------------------- "match the background" mode

              /** Take a few samples shortly after showing (lets the home transition settle). */
              private fun requestSamples() {
                  if (Build.VERSION.SDK_INT < 30 || colorMode != Prefs.MODE_BACKGROUND || calibrating) return
                  handler.removeCallbacks(sampleRunnable)
                  handler.postDelayed(sampleRunnable, 30)
                  handler.postDelayed(sampleRunnable, 700)
              }

              private fun sampleBackground() {
                  if (Build.VERSION.SDK_INT < 30) return
                  if (!shown || colorMode != Prefs.MODE_BACKGROUND || calibrating) return
                  val now = SystemClock.uptimeMillis()
                  if (now - lastShot < 300) return
                  lastShot = now
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, bg,
                          object : AccessibilityService.TakeScreenshotCallback {
                              override fun onSuccess(result: AccessibilityService.ScreenshotResult) {
                                  handleShot(result)
                              }
                              override fun onFailure(errorCode: Int) {}
                          })
                  } catch (_: Throwable) {}
              }

              /** Runs on the background thread. */
              private fun handleShot(r: AccessibilityService.ScreenshotResult) {
                  val hb = r.hardwareBuffer
                  try {
                      val hw = Bitmap.wrapHardwareBuffer(hb, r.colorSpace) ?: return
                      val sw = hw.copy(Bitmap.Config.ARGB_8888, false)
                      hw.recycle()
                      if (sw == null) return
                      val dark = analyse(sw)
                      sw.recycle()
                      if (dark != null) {
                          handler.post {
                              if (dark != bgDark) {
                                  bgDark = dark
                                  applyColor()
                              }
                          }
                      }
                  } catch (_: Throwable) {
                  } finally {
                      try { hb.close() } catch (_: Throwable) {}
                  }
              }

              /**
               * Median brightness of a thin strip of the status bar area just to the right of the clock
               * (so the clock's own pixels are never measured). Returns true = dark, false = light,
               * null = keep the current colour (hysteresis, avoids flicker).
               */
              private fun analyse(b: Bitmap): Boolean? {
                  val d = resources.displayMetrics.density
                  val barH = min(statusBarHeightPx(), b.height)
                  if (barH <= 0) return null
                  val clockW = (clockView?.width ?: 0).let { if (it > 0) it else (44 * d).toInt() }
                  var x0 = (posX * d).toInt() + clockW + (6 * d).toInt()
                  var x1 = min(b.width, x0 + (110 * d).toInt())
                  if (x1 - x0 < (16 * d).toInt()) {
                      x0 = b.width / 4
                      x1 = b.width * 3 / 4
                  }
                  val y0 = barH / 5
                  val y1 = barH * 4 / 5
                  val hist = IntArray(256)
                  var n = 0
                  var y = y0
                  while (y < y1) {
                      var x = x0
                      while (x < x1) {
                          val c = b.getPixel(x, y)
                          val l = (0.299 * Color.red(c) + 0.587 * Color.green(c) + 0.114 * Color.blue(c)).toInt()
                          hist[l.coerceIn(0, 255)]++
                          n++
                          x += 3
                      }
                      y += 3
                  }
                  if (n == 0) return null
                  var acc = 0
                  var median = 0
                  for (i in 0..255) {
                      acc += hist[i]
                      if (acc * 2 >= n) { median = i; break }
                  }
                  return when {
                      median > 150 -> false
                      median < 120 -> true
                      else -> null
                  }
              }
          }
